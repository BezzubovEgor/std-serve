name: Tests & Coverage

on: [push, pull_request]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests with coverage
        run: deno test --coverage=coverage --allow-read --allow-net --allow-env --allow-run

      - name: Install deno_lcov
        run: deno install -q -A --unstable https://deno.land/x/deno_lcov/mod.ts

      - name: Convert Deno coverage to LCOV
        run: deno_lcov > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: BezzubovEgor/std-serve
          files: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
